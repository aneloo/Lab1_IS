<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <p:dialog id="editDlg" widgetVar="editDlg" header="Изменение объекта ##{editController.id}"
              modal="true" width="820" responsive="true" dynamic="false" closeOnEscape="true" fitViewport="true">
        <h:form id="editForm">
            <p:messages id="editMessages" globalOnly="true" closable="true"/>
            <h:panelGroup rendered="#{editController.loaded}">
                <div class="muted" style="margin-bottom: 8px">
                    Дата создания: <h:outputText value="#{editController.form.creature.creationDate}">
                        <f:convertDateTime type="localDateTime" pattern="dd.MM.yyyy HH:mm:ss"/>
                    </h:outputText> (генерируется автоматически)
                </div>
                <ui:include src="/WEB-INF/includes/creature-form.xhtml">
                    <ui:param name="form" value="#{editController.form}"/>
                    <ui:param name="controller" value="#{editController}"/>
                    <ui:param name="edit" value="#{true}"/>
                </ui:include>
                <div class="actions">
                    <p:commandButton value="Сохранить" icon="pi pi-save" action="#{editController.save(afterSave)}"
                                     process="@form" update="@form"
                                     oncomplete="IS.afterSave(args, 'editDlg')"/>
                    <p:commandButton value="Отмена" icon="pi pi-times" type="button"
                                     styleClass="ui-button-flat" onclick="PF('editDlg').hide()"/>
                </div>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
